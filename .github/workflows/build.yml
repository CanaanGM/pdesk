# Lints and tests every push. A pushed tag like v0.1.0 also builds the release exe and
# publishes a GitHub Release with a zip (pdesk.exe, install.ps1, README.md) and its checksum.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets
      - run: cargo test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} but Cargo.toml says $version" }
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $dir = "pdesk-$tag"
          New-Item -ItemType Directory $dir, dist | Out-Null
          Copy-Item target/release/pdesk.exe, install.ps1, README.md $dir
          Compress-Archive $dir "dist/pdesk-$tag-windows-x64.zip"
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = @"
          Download ``pdesk-$tag-windows-x64.zip``, unzip it, and in that folder run:

          ``````powershell
          powershell -ExecutionPolicy Bypass -File install.ps1
          ``````

          Say Yes to the admin prompt. The guide: https://canaangm.github.io/pdesk/
          "@
          gh release create $tag (Get-ChildItem dist).FullName --title "pdesk $tag" --notes $notes --generate-notes
